name: Build iOS Simulator Feature

on:
  push:
    branches:
      - feature/ios-simulator-selector
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        java: ['21']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --stacktrace
      
      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-intellij-plugin-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            build/distributions/*.zip
            build/reports/
            build/test-results/
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            build/test-results/
            build/reports/tests/
          retention-days: 7
  
  build-summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed for iOS Simulator feature" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes:" >> $GITHUB_STEP_SUMMARY
          echo "- Added IOSSimulator and IOSSimulatorManager classes" >> $GITHUB_STEP_SUMMARY
          echo "- Integrated iOS simulators into DeviceService" >> $GITHUB_STEP_SUMMARY
          echo "- Enhanced FlutterDevice for automatic simulator launch" >> $GITHUB_STEP_SUMMARY
